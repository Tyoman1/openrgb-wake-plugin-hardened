name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin Python: GitHub runners now default to Python 3.14, which some
      # tools do not support yet
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Qt 6.8.3 MSVC build - must match the Qt OpenRGB 1.0 ships with.
      # Every command surfaces its tail into a ::error:: annotation so the
      # real failure reason is visible via the Checks API.
      - name: Install Qt 6.8.3 (MSVC)
        shell: pwsh
        run: |
          $out = & pip install --disable-pip-version-check aqtinstall==3.3.0 2>&1 | Out-String
          Write-Host $out
          $out | Set-Content -Path qt-install.log
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=pip install failed::$((($out -split '\r?\n') | Where-Object { $_ } | Select-Object -Last 5) -join ' | ')"; exit 1 }

          $archs = ((& python -m aqt list-qt windows desktop --arch 6.8.3 2>&1 | Out-String) -replace '\s+', ' ').Trim()
          Write-Host "Qt 6.8.3 architectures: $archs"
          Write-Host "::notice title=Qt 6.8.3 architectures::$archs"

          $out = & python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP\Qt" 2>&1 | Out-String
          Write-Host $out
          Add-Content -Path qt-install.log -Value $out
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=aqt install-qt failed::$((($out -split '\r?\n') | Where-Object { $_ } | Select-Object -Last 8) -join ' | ')"; exit 1 }

          "Qt6_DIR=$env:RUNNER_TEMP\Qt\6.8.3\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          # Make sure CMake is recent enough to know the installed Visual Studio
          $cmakeVer = (& pip install --disable-pip-version-check --upgrade cmake 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pip cmake upgrade failed ($LASTEXITCODE) $($cmakeVer -split '\r?\n' | Select-Object -Last 3 | Join-String -Separator ' | ')"; exit 1 }

          (& cmake --version) | Select-Object -First 1

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsInfo = (& $vswhere -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productDisplayVersion,installationPath) | Join-String -Separator ' | '
            Write-Host "vswhere says: $vsInfo"
          }

          # Collect the Visual Studio generator names this CMake knows, newest first
          $gens = @()
          $helpOut = (& cmake --help 2>&1) | Out-String
          foreach ($m in [regex]::Matches($helpOut, 'Visual Studio \d+ \d{4}')) {
            if ($gens -notcontains $m.Value) { $gens += $m.Value }
          }
          [array]::Reverse($gens)
          Write-Host "candidate generators: $($gens -join ', ')"

          $configured = $false
          foreach ($gen in $gens) {
            if (Test-Path build) { Remove-Item -Recurse -Force build }
            $out = & cmake -S . -B build -G $gen -A x64 "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR" 2>&1 | Out-String
            Write-Host "--- generator: $gen ---"
            Write-Host $out
            if ($LASTEXITCODE -eq 0) { $configured = $true; "configured with $gen" | Set-Content configure.log; break }
          }

          if (-not $configured) {
            if (Test-Path build) { Remove-Item -Recurse -Force build }
            $out = & cmake -S . -B build "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR" 2>&1 | Out-String
            Write-Host "--- default generator ---"
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=CMake configure failed::$((($out -split '\r?\n') | Where-Object { $_ } | Select-Object -Last 12) -join ' | ')"; exit 1 }
          }

      - name: Build
        shell: pwsh
        run: |
          $out = & cmake --build build --config Release --parallel 4 2>&1 | Out-String
          Write-Host $out
          $out | Set-Content -Path build.log
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Compile failed::$((($out -split '\r?\n') | Where-Object { $_ } | Select-Object -Last 40) -join ' | ')"; exit 1 }

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBWakePlugin
          path: build/Release/OpenRGBWakePlugin.dll

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          if-no-files-found: ignore