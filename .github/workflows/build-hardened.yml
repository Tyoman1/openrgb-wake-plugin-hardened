name: build-hardened

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP\Qt"
          "Qt6_DIR=$env:RUNNER_TEMP\Qt\6.8.3\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii

      - name: Install pinned CMake
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cmake==3.31.6
          cmake --version

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          # Collect the Visual Studio generator names this CMake knows, newest first
          $gens = @()
          $helpOut = (& cmake --help 2>&1) | Out-String
          foreach ($m in [regex]::Matches($helpOut, 'Visual Studio \d+ \d{4}')) {
            if ($gens -notcontains $m.Value) { $gens += $m.Value }
          }
          [array]::Reverse($gens)
          Write-Host "candidate generators: $($gens -join ', ')"

          $configured = $false
          foreach ($gen in $gens) {
            if (Test-Path build) { Remove-Item -Recurse -Force build }
            $out = & cmake -S . -B build -G $gen -A x64 "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR" 2>&1 | Out-String
            Write-Host "--- generator: $gen ---"
            Write-Host $out
            if ($LASTEXITCODE -eq 0) { $configured = $true; "configured with $gen" | Set-Content configure.log; break }
          }

          if (-not $configured) {
            if (Test-Path build) { Remove-Item -Recurse -Force build }
            $out = & cmake -S . -B build "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR" 2>&1 | Out-String
            Write-Host "--- default generator ---"
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=CMake configure failed::$((($out -split '\r?\n') | Where-Object { $_ } | Select-Object -Last 12) -join ' | ')"; exit 1 }
          }

      - name: Build
        shell: pwsh
        run: |
          $out = & cmake --build build --config Release --parallel 4 2>&1 | Out-String
          Write-Host $out
          $out | Set-Content -Path build.log
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Compile failed::$((($out -split '\r?\n') | Where-Object { $_ } | Select-Object -Last 40) -join ' | ')"; exit 1 }

      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash build/Release/OpenRGBWakePlugin.dll -Algorithm SHA256 |
            Format-List |
            Out-File build/Release/OpenRGBWakePlugin.sha256.txt

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBWakePlugin-1.3.2-hardened.1
          path: |
            build/Release/OpenRGBWakePlugin.dll
            build/Release/OpenRGBWakePlugin.sha256.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          if-no-files-found: ignore