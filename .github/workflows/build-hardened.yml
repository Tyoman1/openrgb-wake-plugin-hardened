name: build-hardened

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP\Qt"
          "Qt6_DIR=$env:RUNNER_TEMP\Qt\6.8.3\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii

      - name: Configure
        shell: pwsh
        run: |
          # Use the VS-provided cmake which knows VS generators
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "VS 2022: $vsPath"

          # VS 2022 ships cmake; use it directly
          $cmake = "$vsPath\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          Write-Host "cmake: $cmake"
          & $cmake --version

          & $cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR"

      - name: Build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $cmake = "$vsPath\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          & $cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash build/Release/OpenRGBWakePlugin.dll -Algorithm SHA256 |
            Format-List |
            Out-File build/Release/OpenRGBWakePlugin.sha256.txt

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBWakePlugin-1.3.2-hardened.1
          path: |
            build/Release/OpenRGBWakePlugin.dll
            build/Release/OpenRGBWakePlugin.sha256.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          if-no-files-found: ignore