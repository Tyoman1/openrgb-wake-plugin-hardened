name: build-hardened

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Qt ──────────────────────────────────────────────
      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP\Qt"
          "Qt6_DIR=$env:RUNNER_TEMP\Qt\6.8.3\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii

      # ── Tool versions ───────────────────────────────────
      - name: Record tool versions
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vsVer   = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productDisplayVersion

          "VS_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "VS_VER=$vsVer"   | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

          $cmake = "$vsPath\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          $cmakeVer = & $cmake --version 2>&1 | Select-Object -First 1
          "CMAKE_VER=$cmakeVer" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

          python --version 2>&1 | Set-Content buildenv.txt
          echo "aqtinstall: $(python -m pip show aqtinstall 2>&1 | Select-String '^Version:' | ForEach-Object { $_ -replace '^Version:\s*', '' })" | Add-Content buildenv.txt
          echo "cmake: $cmakeVer" | Add-Content buildenv.txt
          echo "msvc: $vsVer" | Add-Content buildenv.txt

      # ── Pre‑build source audit ──────────────────────────
      - name: Pre-build source security audit
        shell: pwsh
        run: |
          $errors = @()
          $src    = Get-Content src/WakePlugin.cpp -Raw
          $mouse  = Get-Content src/MouseActivityWatcher.cpp -Raw
          $meta   = Get-Content src/OpenRGBWakePlugin.json -Raw
          $cmake  = Get-Content CMakeLists.txt -Raw

          # Version
          if ($src -notmatch '1\.3\.2-hardened\.1') {
            $errors += "Version is not 1.3.2-hardened.1"
          }
          # URL
          if ($src -notmatch 'openrgb-wake-plugin-hardened') {
            $errors += "Plugin URL does not point to hardened repo"
          }
          if ($meta -notmatch 'openrgb-wake-plugin-hardened') {
            $errors += "Metadata JSON URL does not point to hardened repo"
          }
          # No raw fallback
          if ($src -match 'GetRGBControllers\(')  { $errors += "GetRGBControllers() found" }
          if ($src -match 'Re-applied lighting')   { $errors += "Old fallback message found" }
          # JSON type checking
          if ($src -notmatch 'is_object')          { $errors += "JSON is_object check missing" }
          if ($src -notmatch 'is_string')          { $errors += "JSON is_string check missing" }
          if ($src -notmatch 'is_boolean')         { $errors += "JSON is_boolean check missing" }
          if ($src -notmatch 'is_number_integer')  { $errors += "JSON is_number_integer check missing" }
          # try/catch
          $tryCount = [regex]::Matches($src, 'catch\s*\(').Count
          if ($tryCount -lt 4) { $errors += "Insufficient catch blocks ($tryCount, expected >=4)" }
          # idle clamp
          if ($src -notmatch 'std::clamp')         { $errors += "idle_resume_sec std::clamp missing" }
          # Injection filter
          if ($mouse -notmatch 'LLMHF_INJECTED')         { $errors += "LLMHF_INJECTED missing" }
          if ($mouse -notmatch 'LLMHF_LOWER_IL_INJECTED') { $errors += "LLMHF_LOWER_IL_INJECTED missing" }
          if ($mouse -notmatch 'FreeLibrary')             { $errors += "FreeLibrary not found" }
          # SHA pin
          if ($cmake -notmatch 'URL_HASH\s+SHA256=')     { $errors += "nlohmann/json SHA-256 pin missing" }

          if ($errors.Count -gt 0) {
            foreach ($e in $errors) { Write-Host "::error::$e" }
            exit 1
          }
          Write-Host "::notice::All pre-build security checks passed"

      # ── CMake configure ────────────────────────────────
      - name: Configure
        shell: pwsh
        run: |
          $cmake = "$env:VS_PATH\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          & $cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR"

      # ── Release build ──────────────────────────────────
      - name: Build
        shell: pwsh
        run: |
          $cmake = "$env:VS_PATH\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          & $cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ── Branch guard ──────────────────────────────────
      - name: Assert branch (release builds must be from main)
        shell: pwsh
        run: |
          $branch = "$env:GITHUB_REF_NAME"
          Write-Host "Branch: $branch"
          if ($branch -ne "main") {
            Write-Host "::error::Release builds must be from main, current branch is '$branch'"
            exit 1
          }
          "BRANCH=$branch" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

      # ── DLL existence ─────────────────────────────────
      - name: Verify DLL exists
        shell: pwsh
        run: |
          if (-not (Test-Path build/Release/OpenRGBWakePlugin.dll)) { exit 1 }
          Write-Host "DLL found, size: $((Get-Item build/Release/OpenRGBWakePlugin.dll).Length) bytes"

      # ── Version + URL metadata check ──────────────────
      - name: Verify DLL metadata (version + URL)
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("build/Release/OpenRGBWakePlugin.dll")
          $text  = [System.Text.Encoding]::UTF8.GetString($bytes)

          if ($text -match '1\.3\.2-hardened\.1') {
            Write-Host "Version 1.3.2-hardened.1: OK"
          } elseif ($text -match '1\.3\.2[^-]') {
            Write-Host "::error::DLL contains version 1.3.2 (unhardened!)"
            exit 1
          } else {
            Write-Host "::error::Could not verify DLL version"
            exit 1
          }

          if ($text -match 'openrgb-wake-plugin-hardened') {
            Write-Host "URL = openrgb-wake-plugin-hardened: OK"
          } else {
            Write-Host "::error::DLL URL does not point to hardened repo"
            exit 1
          }

      # ── SHA-256 ────────────────────────────────────────
      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = Get-FileHash build/Release/OpenRGBWakePlugin.dll -Algorithm SHA256
          "$($hash.Hash)  OpenRGBWakePlugin.dll" | Out-File build/Release/OpenRGBWakePlugin.sha256.txt -Encoding ascii
          Write-Host "SHA256: $($hash.Hash)"

      # ── SHA self‑check ─────────────────────────────────
      - name: Verify SHA-256 file
        shell: pwsh
        run: |
          $actual = Get-FileHash build/Release/OpenRGBWakePlugin.dll -Algorithm SHA256
          $stored = (Get-Content build/Release/OpenRGBWakePlugin.sha256.txt -Raw).Trim() -split '\s+' | Select-Object -First 1
          if ($actual.Hash -ne $stored) {
            Write-Host "::error::SHA256 mismatch: actual=$($actual.Hash) stored=$stored"
            exit 1
          }
          Write-Host "SHA256 self-check: OK"

      # ── PE header analysis ─────────────────────────────
      - name: PE security analysis
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("build/Release/OpenRGBWakePlugin.dll")
          $peOffset = [System.BitConverter]::ToUInt32($bytes, 0x3C)
          $oh = $peOffset + 4 + 20          # optional header start
          $magic = [System.BitConverter]::ToUInt16($bytes, $oh)
          $arch = if ($magic -eq 0x020B) { "PE32+" } else { "PE32" }

          # File header info
          $fh = $peOffset + 4
          $numSec = [System.BitConverter]::ToUInt16($bytes, $fh + 2)
          $optHdrSz = [System.BitConverter]::ToUInt16($bytes, $fh + 16)
          $secOff = $fh + 20 + $optHdrSz

          # Helper: RVA to file offset
          function RvaToRaw($rva) {
            param($rva)
            for ($i = 0; $i -lt $numSec; $i++) {
              $so = $secOff + $i * 40
              $secVA  = [System.BitConverter]::ToUInt32($bytes, $so + 12)
              $secRaw = [System.BitConverter]::ToUInt32($bytes, $so + 20)
              $secSz  = [System.BitConverter]::ToUInt32($bytes, $so + 16)
              if ($rva -ge $secVA -and $rva -lt ($secVA + $secSz)) {
                return $rva - $secVA + $secRaw
              }
            }
            return 0
          }

          # ── Standard DllCharacteristics ──────────────────
          $dllChars = [System.BitConverter]::ToUInt16($bytes, $oh + 70)
          $aslr = ($dllChars -band 0x0040) -ne 0
          $dep  = ($dllChars -band 0x0100) -ne 0
          $cfg  = ($dllChars -band 0x4000) -ne 0
          $heva = ($dllChars -band 0x0020) -ne 0

          # ── Data directories ─────────────────────────────
          $dataDirOfs = $oh + 112   # first data directory for PE32+
          # Debug Directory = entry 6
          $debugRVA  = [System.BitConverter]::ToUInt32($bytes, $dataDirOfs + 6 * 8)
          $debugSize = [System.BitConverter]::ToUInt32($bytes, $dataDirOfs + 6 * 8 + 4)

          # ── CET via IMAGE_DEBUG_TYPE_EX_DLLCHARACTERISTICS (type 20) ──
          $cet = $false
          $debugOff = RvaToRaw $debugRVA
          if ($debugOff -gt 0 -and $debugSize -gt 0) {
            $numDebugEntries = [int]($debugSize / 28)  # each IMAGE_DEBUG_DIRECTORY is 28 bytes
            for ($d = 0; $d -lt $numDebugEntries; $d++) {
              $entryOff = $debugOff + $d * 28
              $debugType = [System.BitConverter]::ToUInt32($bytes, $entryOff + 12)
              if ($debugType -eq 20) {
                $dataRVA  = [System.BitConverter]::ToUInt32($bytes, $entryOff + 20)
                $dataSize = [System.BitConverter]::ToUInt32($bytes, $entryOff + 24)
                $dataOff = RvaToRaw $dataRVA
                if ($dataOff -gt 0 -and $dataSize -ge 2) {
                  $exChars = [System.BitConverter]::ToUInt16($bytes, $dataOff)
                  if ($exChars -band 0x0001) { $cet = $true }
                }
                break
              }
            }
          }

          # ── GS via IMAGE_LOAD_CONFIG_DIRECTORY64.SecurityCookie ──
          $gs = $false
          $loadCfgRVA  = [System.BitConverter]::ToUInt32($bytes, $dataDirOfs + 10 * 8)
          $loadCfgSize = [System.BitConverter]::ToUInt32($bytes, $dataDirOfs + 10 * 8 + 4)
          $loadCfgOff = RvaToRaw $loadCfgRVA
          if ($loadCfgOff -gt 0 -and $loadCfgSize -ge 80) {
            # For PE32+, IMAGE_LOAD_CONFIG_DIRECTORY64 has SecurityCookie at offset 0x30 (48)
            $cookieField = [System.BitConverter]::ToUInt64($bytes, $loadCfgOff + 0x30)
            if ($cookieField -ne 0) { $gs = $true }
          }

          # Persist
          "PE_ARCH=$arch"             | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "PE_ASLR=$aslr"             | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "PE_DEP=$dep"               | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "PE_CFG=$cfg"               | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "PE_HEVA=$heva"             | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "PE_CET=$cet"               | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "PE_GS=$gs"                 | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "PE_DLLCHARS=0x$('{0:X4}' -f $dllChars)" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

          Write-Host "ARCH=$arch | ASLR=$aslr DEP=$dep CFG=$cfg HE-VA=$heva CET=$cet GS=$gs DLLCHARS=0x$('{0:X4}' -f $dllChars)"

      # ── Import check ──────────────────────────────────
      - name: Check DLL imports
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("build/Release/OpenRGBWakePlugin.dll")

          $expected  = @("KERNEL32","USER32","Qt6Core","Qt6Gui","Qt6Widgets","MSVCP","VCRUNTIME")
          $dangerous = @("WinInet","WinHTTP","WS2_32","CreateProcess","ShellExecute","WinExec","URLDownloadToFile","PowerShell","cmd.exe","VirtualAlloc","VirtualProtect")

          function FindString($name) {
            $pat = [System.Text.Encoding]::UTF8.GetBytes($name)
            for ($i = 0; $i -le $bytes.Length - $pat.Length; $i++) {
              $match = $true
              for ($j = 0; $j -lt $pat.Length; $j++) { if ($bytes[$i+$j] -ne $pat[$j]) { $match = $false; break } }
              if ($match) { return $true }
            }
            return $false
          }

          $allExpOk = $true
          foreach ($n in $expected) { $f = FindString $n; if (-not $f) { $allExpOk = $false }; Write-Host "  $n : $(if ($f) { 'OK' } else { 'NOT FOUND' })" }
          if (-not $allExpOk) { Write-Host "::warning::Some expected imports not found" }

          $allDangerOk = $true
          foreach ($n in $dangerous) { $f = FindString $n; if ($f) { Write-Host "::error::DANGEROUS IMPORT: $n"; $allDangerOk = $false } }
          if ($allDangerOk) { Write-Host "  dangerous APIs : none" }

          # Persist
          "IMP_OK=$allExpOk" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "IMP_DANGER_OK=$allDangerOk" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

      # ── Generate BUILD_REPORT.md ──────────────────────
      - name: Generate BUILD_REPORT.md
        shell: pwsh
        run: |
          $hash = Get-FileHash build/Release/OpenRGBWakePlugin.dll -Algorithm SHA256
          $size = (Get-Item build/Release/OpenRGBWakePlugin.dll).Length
          $commit = "$env:GITHUB_SHA"
          $branch = "$env:GITHUB_REF_NAME"
          $runId  = "$env:GITHUB_RUN_ID"
          $repo   = "$env:GITHUB_REPOSITORY"

          # Pre-compute complex values
          $pyVer = & python --version 2>&1
          $aqtVer = & python -m pip show aqtinstall 2>&1 | Select-String '^Version:' | ForEach-Object { ($_ -replace '^Version:\s*', '').Trim() }

          $aslr  = if ("$env:PE_ASLR" -eq "True") { "PASS" } else { "FAIL" }
          $heva  = if ("$env:PE_HEVA" -eq "True") { "PASS" } else { "FAIL" }
          $dep   = if ("$env:PE_DEP" -eq "True") { "PASS" } else { "FAIL" }
          $cfg   = if ("$env:PE_CFG" -eq "True") { "PASS" } else { "FAIL" }
          $cet   = if ("$env:PE_CET" -eq "True") { "PASS" } else { "FAIL" }
          $gs    = if ("$env:PE_GS" -eq "True") { "PASS" } else { "INFO: not visible (Release)" }

          $lines = @()
          $lines += "# BUILD REPORT - OpenRGB Wake Plugin 1.3.2-hardened.1"
          $lines += ""
          $lines += "## Source"
          $lines += "| Field | Value |"
          $lines += "|---|---|"
          $lines += "| Repository | https://github.com/$repo |"
          $lines += "| Branch | $branch |"
          $lines += "| Commit | $commit |"
          $lines += "| Workflow Run ID | $runId |"
          $lines += ""
          $lines += "## Build Environment"
          $lines += "| Field | Value |"
          $lines += "|---|---|"
          $lines += "| Runner | windows-2022 |"
          $lines += "| MSVC | $env:VS_VER |"
          $lines += "| CMake | $env:CMAKE_VER |"
          $lines += "| Qt | 6.8.3 (win64_msvc2022_64) |"
          $lines += "| Python | $pyVer |"
          $lines += "| aqtinstall | $aqtVer |"
          $lines += "| Configuration | Release x64 |"
          $lines += ""
          $lines += "## Binary"
          $lines += "| Field | Value |"
          $lines += "|---|---|"
          $lines += "| File | OpenRGBWakePlugin.dll |"
          $lines += "| Size | $size bytes |"
          $lines += "| SHA-256 | $($hash.Hash) |"
          $lines += "| Version | 1.3.2-hardened.1 |"
          $lines += "| Architecture | $env:PE_ARCH |"
          $lines += ""
          $lines += "## PE Security Flags"
          $lines += "| Flag | Status |"
          $lines += "|---|---|"
          $lines += "| ASLR (/DYNAMICBASE) | $aslr |"
          $lines += "| High Entropy VA (/HIGHENTROPYVA) | $heva |"
          $lines += "| DEP/NX (/NXCOMPAT) | $dep |"
          $lines += "| Control Flow Guard (/guard:cf) | $cfg |"
          $lines += "| CET Compat (/CETCOMPAT) | $cet |"
          $lines += "| GS Security Cookie | $gs |"
          $lines += "| DLL Characteristics | $env:PE_DLLCHARS |"
          $lines += ""
          $lines += "## Source Hardening Checks"
          $lines += "| Check | Status |"
          $lines += "|---|---|"
          $lines += "| GetRGBControllers() absent | PASS |"
          $lines += "| Raw-controller fallback absent | PASS |"
          $lines += "| LLMHF_INJECTED present | PASS |"
          $lines += "| LLMHF_LOWER_IL_INJECTED present | PASS |"
          $lines += "| Version = 1.3.2-hardened.1 | PASS |"
          $lines += "| URL = hardened repo | PASS |"
          $lines += "| nlohmann/json SHA-256 pinned | PASS |"
          $lines += "| JSON type checking (is_*) | PASS |"
          $lines += "| try/catch in Load/Save/Resolve | PASS |"
          $lines += "| idle_resume_sec clamped | PASS |"
          $lines += "| Mouse hook FreeLibrary | PASS |"
          $lines += "| PBT_APMRESUMEAUTOMATIC only | PASS |"
          $lines += ""
          $lines += "## Imports"
          $lines += "| DLL | Status |"
          $lines += "|---|---|"
          $dllBytes = [System.IO.File]::ReadAllBytes("build/Release/OpenRGBWakePlugin.dll")
          function FindInDll($name) {
            $pat = [System.Text.Encoding]::UTF8.GetBytes($name)
            for ($i = 0; $i -le $dllBytes.Length - $pat.Length; $i++) {
              $match = $true
              for ($j = 0; $j -lt $pat.Length; $j++) { if ($dllBytes[$i+$j] -ne $pat[$j]) { $match = $false; break } }
              if ($match) { return $true }
            }
            return $false
          }
          foreach ($n in @("KERNEL32","USER32","Qt6Core","Qt6Gui","Qt6Widgets","MSVCP","VCRUNTIME")) {
            $f = FindInDll $n
            $lines += "| $n | $(if ($f) { 'OK' } else { 'NOT FOUND' }) |"
          }
          $dangerList = @("WinHTTP","WinInet","WS2_32","CreateProcess","ShellExecute","WinExec","URLDownloadToFile","VirtualAlloc","VirtualProtect")
          $dangerOk = $true
          foreach ($n in $dangerList) { if (FindInDll $n) { $dangerOk = $false } }
          $lines += "| Dangerous APIs | $(if ($dangerOk) { 'None' } else { 'FOUND' }) |"
          $lines += ""
          $lines += "## Notes"
          $lines += "- Auto-generated by build-hardened CI workflow"
          $lines += "- Functional testing with physical RGB hardware not performed in CI"

          $lines -join "`n" | Set-Content -Path "build/Release/BUILD_REPORT.md" -Encoding UTF8
          Write-Host "BUILD_REPORT.md generated"

      # ── Source archive ─────────────────────────────────
      - name: Create source archive
        shell: pwsh
        run: |
          git archive --format=zip --output="build/Release/OpenRGBWakePlugin-1.3.2-hardened.1-source.zip" HEAD

      # ── Upload artifact ────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBWakePlugin-1.3.2-hardened.1
          path: |
            build/Release/OpenRGBWakePlugin.dll
            build/Release/OpenRGBWakePlugin.sha256.txt
            build/Release/BUILD_REPORT.md
            build/Release/OpenRGBWakePlugin-1.3.2-hardened.1-source.zip

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          if-no-files-found: ignore